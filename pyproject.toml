[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-interpolation-tools"
version = "0.1.0"
description = "Conservative interpolation between triangular meshes and structured grids"
authors = [
    { name="Aleksei Semenov", email="aleksei.semenov@awi.de" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools.packages.find]
include = ["mesh_interpolation_tools", "mesh_interpolation_tools.*"]